<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
  <title id="title">Hexapod leg frames and tripod membership</title>
  <desc id="desc">Top view of the hexapod with legs 1, 3, and 5 in tripod A; legs 2, 4, and 6 in tripod B; and the positive X and Y directions of every leg frame and the base frame.</desc>
  <defs>
    <marker id="arrow-x" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d33f2f"/>
    </marker>
    <marker id="arrow-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#299447"/>
    </marker>
    <style>
      .leg { fill: none; stroke: #4b5563; stroke-linecap: round; stroke-linejoin: round; }
      .joint { fill: #d8dee6; stroke: #4b5563; stroke-width: 2; }
      .axis-x { fill: none; stroke: #d33f2f; stroke-width: 3; marker-end: url(#arrow-x); }
      .axis-y { fill: none; stroke: #299447; stroke-width: 3; marker-end: url(#arrow-y); }
      .origin { fill: #2563b8; stroke: #fff; stroke-width: 1.5; }
      .axis-label { font: 600 13px sans-serif; paint-order: stroke; stroke: #fff; stroke-width: 3px; stroke-linejoin: round; }
      .leg-label { font: 700 16px sans-serif; fill: #fff; text-anchor: middle; dominant-baseline: central; }
      .small-label { font: 600 12px sans-serif; fill: #344054; }
    </style>
  </defs>

  <!-- Straightened top-view leg silhouettes, numbered as in the robot model. -->
  <g aria-label="legs">
    <path class="leg" stroke-width="18" d="M466 424 L500 458 L548 506"/>
    <circle class="joint" cx="500" cy="458" r="11"/><path class="leg" stroke-width="9" d="M548 506 L573 531"/>
    <path class="leg" stroke-width="18" d="M492 280 L540 280 L608 280"/>
    <circle class="joint" cx="540" cy="280" r="11"/><path class="leg" stroke-width="9" d="M608 280 L640 280"/>
    <path class="leg" stroke-width="18" d="M466 136 L500 102 L548 54"/>
    <circle class="joint" cx="500" cy="102" r="11"/><path class="leg" stroke-width="9" d="M548 54 L573 29"/>
    <path class="leg" stroke-width="18" d="M294 424 L260 458 L212 506"/>
    <circle class="joint" cx="260" cy="458" r="11"/><path class="leg" stroke-width="9" d="M212 506 L187 531"/>
    <path class="leg" stroke-width="18" d="M268 280 L220 280 L152 280"/>
    <circle class="joint" cx="220" cy="280" r="11"/><path class="leg" stroke-width="9" d="M152 280 L120 280"/>
    <path class="leg" stroke-width="18" d="M294 136 L260 102 L212 54"/>
    <circle class="joint" cx="260" cy="102" r="11"/><path class="leg" stroke-width="9" d="M212 54 L187 29"/>
  </g>

  <!-- Simplified base plate. -->
  <path d="M294 118 L330 150 H430 L466 118 L492 144 L475 220 L500 248 V312 L475 340 L492 416 L466 442 L430 410 H330 L294 442 L268 416 L285 340 L260 312 V248 L285 220 L268 144 Z"
        fill="#e8edf2" stroke="#67717e" stroke-width="3"/>
  <rect x="327" y="174" width="106" height="212" rx="20" fill="#cbd3dc" stroke="#8a95a3" stroke-width="2"/>

  <!-- Base frame: +X points left, +Y points toward the front/bottom. -->
  <g aria-label="base frame">
    <line class="axis-x" x1="380" y1="280" x2="318" y2="280"/>
    <line class="axis-y" x1="380" y1="280" x2="380" y2="342"/>
    <circle class="origin" cx="380" cy="280" r="6"/>
    <circle cx="380" cy="280" r="2" fill="#fff"/>
    <text class="axis-label" x="300" y="275" fill="#d33f2f">+X<tspan baseline-shift="sub" font-size="10">B</tspan></text>
    <text class="axis-label" x="388" y="354" fill="#299447">+Y<tspan baseline-shift="sub" font-size="10">B</tspan></text>
    <text class="axis-label" x="390" y="266" fill="#2563b8">+Z<tspan baseline-shift="sub" font-size="10">B</tspan> ⊙</text>
    <text class="small-label" x="380" y="236" text-anchor="middle">base frame</text>
  </g>

  <!-- Local frames: local +X is radial and local +Y is tangential. -->
  <g aria-label="leg 1 frame">
    <line class="axis-x" x1="466" y1="424" x2="500" y2="458"/><line class="axis-y" x1="466" y1="424" x2="493" y2="397"/>
    <circle class="origin" cx="466" cy="424" r="5"/><text class="axis-label" x="502" y="474" fill="#d33f2f">x1</text><text class="axis-label" x="497" y="392" fill="#299447">y1</text>
  </g>
  <g aria-label="leg 2 frame">
    <line class="axis-x" x1="492" y1="280" x2="540" y2="280"/><line class="axis-y" x1="492" y1="280" x2="492" y2="242"/>
    <circle class="origin" cx="492" cy="280" r="5"/><text class="axis-label" x="542" y="275" fill="#d33f2f">x2</text><text class="axis-label" x="499" y="239" fill="#299447">y2</text>
  </g>
  <g aria-label="leg 3 frame">
    <line class="axis-x" x1="466" y1="136" x2="500" y2="102"/><line class="axis-y" x1="466" y1="136" x2="439" y2="109"/>
    <circle class="origin" cx="466" cy="136" r="5"/><text class="axis-label" x="502" y="96" fill="#d33f2f">x3</text><text class="axis-label" x="416" y="105" fill="#299447">y3</text>
  </g>
  <g aria-label="leg 4 frame">
    <line class="axis-x" x1="294" y1="424" x2="260" y2="458"/><line class="axis-y" x1="294" y1="424" x2="321" y2="451"/>
    <circle class="origin" cx="294" cy="424" r="5"/><text class="axis-label" x="235" y="474" fill="#d33f2f">x4</text><text class="axis-label" x="325" y="466" fill="#299447">y4</text>
  </g>
  <g aria-label="leg 5 frame">
    <line class="axis-x" x1="268" y1="280" x2="220" y2="280"/><line class="axis-y" x1="268" y1="280" x2="268" y2="318"/>
    <circle class="origin" cx="268" cy="280" r="5"/><text class="axis-label" x="199" y="275" fill="#d33f2f">x5</text><text class="axis-label" x="276" y="328" fill="#299447">y5</text>
  </g>
  <g aria-label="leg 6 frame">
    <line class="axis-x" x1="294" y1="136" x2="260" y2="102"/><line class="axis-y" x1="294" y1="136" x2="267" y2="163"/>
    <circle class="origin" cx="294" cy="136" r="5"/><text class="axis-label" x="235" y="96" fill="#d33f2f">x6</text><text class="axis-label" x="244" y="178" fill="#299447">y6</text>
  </g>

  <!-- Tripod labels. -->
  <g aria-label="tripod membership">
    <g fill="#d97706"><circle cx="556" cy="473" r="18"/><circle cx="556" cy="87" r="18"/><circle cx="172" cy="280" r="18"/></g>
    <g fill="#7656b5"><circle cx="590" cy="280" r="18"/><circle cx="204" cy="473" r="18"/><circle cx="204" cy="87" r="18"/></g>
    <text class="leg-label" x="556" y="473">1 A</text><text class="leg-label" x="590" y="280">2 B</text><text class="leg-label" x="556" y="87">3 A</text>
    <text class="leg-label" x="204" y="473">4 B</text><text class="leg-label" x="172" y="280">5 A</text><text class="leg-label" x="204" y="87">6 B</text>
  </g>

  <g transform="translate(270 536)" aria-label="legend">
    <circle cx="0" cy="0" r="7" fill="#d97706"/><text class="small-label" x="12" y="4">tripod A</text>
    <circle cx="108" cy="0" r="7" fill="#7656b5"/><text class="small-label" x="120" y="4">tripod B</text>
  </g>
</svg>
