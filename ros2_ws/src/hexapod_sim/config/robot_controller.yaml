controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

joint_trajectory_controller:
  ros__parameters:
    type: joint_trajectory_controller/JointTrajectoryController
    joints:
      - jl11
      - jl12
      - jl13
      
      - jl21
      - jl22
      - jl23
      
      - jl31
      - jl32
      - jl33
      
      - jl41
      - jl42
      - jl43
      
      - jl51
      - jl52
      - jl53
      
      - jl61
      - jl62
      - jl63
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    #interpolation_method: none
